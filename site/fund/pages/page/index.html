<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金净值</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0 20px;
            color: #333;
        }
        #filter {
            display: none; /* 默认隐藏 */
            flex-direction: column;
            gap: 10px;
            position: fixed;
            right: 20px;
            top: 20px;
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            opacity: 1;
        }
        /* 悬浮图标样式 */
        #filter-toggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 50px;
            height: 50px;
            background-color: #3498db;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1001;
        }
        .filter-item select {
            border-radius: 5px;
            border: 1px solid #ddd;
            background-color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        /* 添加order_type的垂直排列样式 */
        #order_type {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #content {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .content-item {
            
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            /* padding: 20px; */
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
            align-items: center;
            width: 100%;
        }
        .content-item > div {
            padding: 10px;
        }
        .fund-info{
            text-align: center;
        }
        .fund-name {
            font-weight: bold;
            font-size: 18px;
            color: #2c3e50;
        }
        .fund-name a{
            text-decoration: none;
            color: inherit;
        }
        .fund-details {
            font-size: 14px;
            color: #7f8c8d;
        }
        .fund-chart {
            height: 100px;
            background-color: #ecf0f1;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            position: relative;
        }
        .fund-chart canvas {
            width: 100% !important;
            height: 100% !important;
        }
        @media (max-width: 768px) {
            .content-item {
                grid-template-columns: 1fr;
            }
            /* 在移动端，悬浮图标位置适当调整 */
            #filter-toggle {
                right: 15px;
                bottom: 15px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            
            /* 移动端filter居中显示 */
            #filter {
                left: 50%;
                right: auto;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 80%;
                max-width: 300px;
            }
        }
    </style>
    <script src="./script/chart.umd-4.5.0.js"></script>
    <script src="./script/virtual-scroller-dom.js"></script>
</head>
<body>
    <!-- 悬浮图标 -->
    <div id="filter-toggle">⚙️</div>
    
    <div id="filter">
        <div class="filter-item">
            2025年8月16日 - 2025年8月16日
        </div>
        <div class="filter-item">
            <input type="checkbox" id="order_direct">
            <label for="order_direct">逆序</label>
            <input type="checkbox" id="rate_change_5" checked>
            <label for="rate_change_5">浮动>=5</label>
            <input type="checkbox" id="can_buy" checked>
            <label for="can_buy">购买</label>
        </div>
        <div class="filter-item">
            <checkbox id="order_type">
            </checkbox>
        </div>
    </div>
    <div id="content">
        <div class="content-item">
            <div class="fund-info">
                <div class="fund-name">
                    <span></span>
                    <a target="_blank" referrerpolicy="no-referrer">基金代码</a>
                </div>
                <div class="fund-details">
                    <span>申购状态 / rate</span>
                </div>
            </div>
            <div class="fund-chart">
                <canvas></canvas>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="./index.js"></script>
    <script>
        // 添加悬浮图标点击事件
        document.getElementById('filter-toggle').addEventListener('click', function() {
            const filter = document.getElementById('filter');
            if (filter.style.display === 'none' || filter.style.display === '') {
                filter.style.display = 'flex';
            } else {
                filter.style.display = 'none';
            }
        });
        
        let contentItemEl = document.querySelector('#content>.content-item').cloneNode(true);

        function renderJj(one){
            let el = contentItemEl.cloneNode(true);
            el.querySelector('.fund-name span').textContent = one.name + '-' + one.feature.netMaxMinusMin;
            el.querySelector('.fund-name a').textContent = "("+ one.code +")";
            el.querySelector('.fund-name a').href = `https://fund.10jqka.com.cn/${one.code}/`;
            el.querySelector('.fund-details span').textContent = `
                ${jj_feature_fn.filter(el=>!el.hide).map(el=>el.text + ':' + one.feature[el.name]).join(' / ')}
                `;
            const canvas = el.querySelector('.fund-chart canvas');

            setTimeout(() => {
                const ctx = canvas.getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: window.jj_labels,
                        datasets: [{
                            label: '-',
                            data: one.net.map(Number),
                            borderColor: 'rgb(75, 192, 192)',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: false,
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });
            }, 0);

            return el;
        }

        let options = {
            days: 15,
            days_limit: 30,
            order_type: [],
            order_direct: false,
            rate_change_5: true,
            can_buy: true
        }
        
        fetchData2(options.days, options.days_limit).then(jjlist =>{
            let jj_labels = jjlist.netset.map(el=>el.date).map(el=>el.substring(5)).reverse();
            document.querySelector('.filter-item:nth-child(1)').textContent = `${jj_labels[0]} - ${jj_labels[jj_labels.length-1]}` 

            let jjdata = mergeNet2(jjlist);

            window.virtualScroller = new VirtualScroller(
                document.getElementById('content'),
                [],
                renderJj
            ).virtualScroller

            window.jjdata = jjdata
            window.jj_labels = jj_labels

            let order_type_el = document.getElementById('order_type');
            jj_feature_fn.map(el=>{
                let optEl = document.createElement('label');
                optEl.innerHTML = `<input type="checkbox" name="checkbox" value="${el.name}"> ${el.text}`;
                order_type_el.appendChild(optEl);
            })

            renderPage()
        })

        function renderPage(){
            let data = Array.from(window.jjdata);

            data.sort((a,b)=>{
                for(let el of options.order_type){
                    let ret = b.feature[el] - a.feature[el];
                    if(ret > 0){
                        return 1
                    }
                    if(ret < 0){
                        return -1;
                    }
                }
                return 0;
            })

            if(options.order_direct){
                data.reverse();
            }
            if(options.rate_change_5){
                data = data.filter(el=>el.feature.netMaxMinusMin >= 5);
            }

            window.virtualScroller.setItems([]);
            window.virtualScroller.setItems(data);
            window.virtualScroller.scroll.scrollToY(0)
        }

        document.getElementById('order_type').addEventListener('change', function(e) {
            if(e.target.checked){
                options.order_type.push(e.target.value);
            }else{
                options.order_type = options.order_type.filter(el=>el!=e.target.value);
            }

            renderPage();
        });

        document.getElementById('order_direct').addEventListener('change', function(e) {
            options.order_direct = e.target.checked;
            renderPage();
        });
        document.getElementById('rate_change_5').addEventListener('change', function(e) {
            options.rate_change_5 = e.target.checked;
            renderPage();
        });
        document.getElementById('can_buy').addEventListener('change', function(e) {
            options.can_buy = e.target.checked;
            renderPage();
        });

    </script>
</body>
</html>
