<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航首页 · 双链接选择</title>
  <style>
    /* 全局重置与字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* 主卡片容器 */
    .home-card {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 
        0 25px 45px -12px rgba(0, 20, 40, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
    }

    /* 标题与副标题 */
    .hero {
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .hero h1 {
      font-size: 2.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0c1e30;
      margin-bottom: 0.6rem;
      text-shadow: 0 2px 5px rgba(255, 255, 255, 0.8);
    }

    .hero p {
      font-size: 1.1rem;
      color: #2e4a6b;
      opacity: 0.85;
      font-weight: 400;
      border-bottom: 1.5px dashed #b7c9e0;
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    /* 链接网格：两个大卡片 */
    .link-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
      justify-content: center;
    }

    /* 每个链接卡片：不画外框，只靠图标和文字撑起视觉 */
    .link-item {
      flex: 1 1 220px;
      min-width: 200px;
      background: transparent;
      border: 0;
      border-radius: 2.2rem;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }

    /* 悬停效果：只轻微上浮，不再冒出边框或阴影 */
    .link-item:hover {
      transform: translateY(-6px);
    }

    .link-item:active {
      transform: translateY(-2px);
      transition-duration: 0.08s;
    }

    /* 卡片内部内容区 */
    .link-content {
      padding: 2.2rem 1.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 圆形图标背景 */
    .link-icon {
      width: 75px;
      height: 75px;
      background: linear-gradient(135deg, #e8f0fe, #d8e5f5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.4rem;
      box-shadow: 0 6px 12px -6px rgba(0, 40, 80, 0.2), inset 0 2px 4px rgba(255, 255, 255, 0.9);
      transition: background 0.2s;
    }

    .link-item:hover .link-icon {
      background: linear-gradient(135deg, #d9e8ff, #c2d9f5);
    }

    /* 图标图形 (纯CSS / SVG 内联) */
    .link-icon svg {
      width: 40px;
      height: 40px;
      stroke: #2367a5;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }

    .link-item:hover .link-icon svg {
      stroke: #0c4e7e;
    }

    /* 链接标题 */
    .link-title {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #10314f;
      margin-bottom: 0.35rem;
      line-height: 1.25;
    }

    /* 链接描述文字 */
    .link-desc {
      font-size: 0.95rem;
      color: #42678a;
      opacity: 0.8;
      font-weight: 400;
      margin-bottom: 1.2rem;
    }

    /* 提示可点击的小标签 (使用箭头) */
    .link-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #2367a5;
      background: #e4eefb;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      transition: all 0.2s;
      margin-top: 0.25rem;
      letter-spacing: 0.3px;
    }

    .link-item:hover .link-cta {
      background: #2367a5;
      color: white;
    }

    .link-cta span {
      font-size: 1.1rem;
      line-height: 1;
      transition: transform 0.2s;
    }

    .link-item:hover .link-cta span {
      transform: translateX(4px);
    }

    /* 为第二个卡片保留一些微妙的色差 */
    .link-item:nth-child(2) .link-icon {
      background: linear-gradient(135deg, #e6f0fa, #d2e2f2);
    }

    /* 小屏幕适配 */
    @media (max-width: 500px) {
      .home-card {
        padding: 2rem 1.25rem;
        border-radius: 2.2rem;
      }

      .hero h1 {
        font-size: 1.9rem;
      }

      .hero p {
        font-size: 1rem;
      }

      .link-grid {
        gap: 1.2rem;
      }

      .link-item {
        flex: 1 1 100%;
        min-width: 0;
      }

      .link-content {
        padding: 1.8rem 1.2rem 1.5rem;
      }

      .link-title {
        font-size: 1.45rem;
      }

      .link-icon {
        width: 64px;
        height: 64px;
      }

      .link-icon svg {
        width: 34px;
        height: 34px;
      }
    }

    /* 为减少动态效果偏好的人 */
    @media (prefers-reduced-motion: reduce) {
      .link-item,
      .link-icon,
      .link-cta,
      .link-cta span {
        transition: none;
      }
      .link-item:hover {
        transform: none;
      }
    }

    /* 简单聚焦样式，方便键盘导航 */
    .link-item:focus-visible {
      outline: 3px solid #2367a5;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="home-card">
    <!-- 卡片由下方 <script> 中的 SITES 数组渲染，此处留空即可 -->
    <div class="link-grid"></div>

    <!-- 底部可增加极简装饰说明，不需要可以删除，不干扰布局 -->
    <div style="margin-top: 2rem; text-align: center; font-size: 0.75rem; color: #a0b8d0; letter-spacing: 0.3px;">
    </div>
  </main>

  <script>
    /* ================================================================
       入口配置区
       ----------------------------------------------------------------
       以后要加新的二级目录，只需往 SITES 数组里追加一项，刷新页面即可，
       不用改 HTML 结构、不用额外 JS 文件。

       每一项的字段：
         title  卡片标题
         desc   副标题（建议带上目录名，方便辨认）
         href   跳转地址：
                  './it-tools/'      同站点的二级目录，推荐写法
                  '/xxx/'            站点根路径
                  'https://a.com'    外部链接，会自动新标签页打开
         icon   可选，内置图标：'tools' | 'image' | 'globe'（不写默认 globe）
       ================================================================ */
    const SITES = [
      {
        title: '开发者工具',
        desc: 'it-tools · 开发者在线工具箱',
        href: './it-tools/',
        icon: 'tools',
      },
      {
        title: '漫画滤镜',
        desc: 'animefilter · 图片一键转漫画',
        href: './animefilter/',
        icon: 'image',
      },
    ];

    /* 内置图标（纯内联 SVG，不请求任何外部资源） */
    const ICONS = {
      tools:
        '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>' +
        '</svg>',
      image:
        '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>' +
        '<circle cx="8.5" cy="8.5" r="1.5"/>' +
        '<polyline points="21 15 16 10 5 21"/>' +
        '</svg>',
      globe:
        '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="10"/>' +
        '<line x1="2" y1="12" x2="22" y2="12"/>' +
        '<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>' +
        '</svg>',
    };

    /* 把 SITES 渲染成卡片 */
    (function renderSites() {
      const grid = document.querySelector('.link-grid');
      if (!grid) return;

      const isExternal = (url) => /^(https?:)?\/\//i.test(url);
      const frag = document.createDocumentFragment();

      SITES.forEach((site) => {
        if (!site || !site.href) return; // 跳过没填地址的条目

        const a = document.createElement('a');
        a.className = 'link-item';
        a.href = site.href;

        // 外部链接才新开标签页，站内二级目录留在当前页
        if (isExternal(site.href)) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }

        const content = document.createElement('div');
        content.className = 'link-content';

        const icon = document.createElement('div');
        icon.className = 'link-icon';
        icon.innerHTML = ICONS[site.icon] || ICONS.globe;

        const title = document.createElement('div');
        title.className = 'link-title';
        title.textContent = site.title || '未命名入口';

        const desc = document.createElement('div');
        desc.className = 'link-desc';
        desc.textContent = site.desc || site.href;

        const cta = document.createElement('div');
        cta.className = 'link-cta';
        cta.innerHTML = '前往 <span>→</span>';

        content.append(icon, title, desc, cta);
        a.append(content);
        frag.append(a);
      });

      grid.append(frag);
    })();
  </script>
</body>
</html>
